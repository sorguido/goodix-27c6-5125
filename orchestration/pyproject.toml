[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodix-orchestrator"
version = "0.3.0"
description = "Deterministic local-first host-only orchestrator for the Goodix project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
goodix-orchestrator = "goodix_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["goodix_orchestrator*"]
