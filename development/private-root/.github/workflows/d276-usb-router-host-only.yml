# SPDX-License-Identifier: LGPL-2.1-or-later
name: D276 USB router host-only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d276-usb-router-host-only.yml'
      - 'libfprint-driver/goodix_usb_router.c'
      - 'libfprint-driver/goodix_usb_router.h'
      - 'libfprint-driver/goodix_fpimage_device.c'
      - 'libfprint-driver/goodix_fpimage_device.h'
      - 'libfprint-driver/tests/test_goodix_usb_router.c'
      - 'libfprint-driver/tests/run_goodix_usb_router_test.sh'
      - 'libfprint-driver/tests/run_goodix_fpimage_device_test.sh'
      - 'libfprint-driver/tests/run_goodix_fpimage_device_test_inner.sh'
  pull_request:
    paths:
      - '.github/workflows/d276-usb-router-host-only.yml'
      - 'libfprint-driver/goodix_usb_router.c'
      - 'libfprint-driver/goodix_usb_router.h'
      - 'libfprint-driver/goodix_fpimage_device.c'
      - 'libfprint-driver/goodix_fpimage_device.h'
      - 'libfprint-driver/tests/test_goodix_usb_router.c'
      - 'libfprint-driver/tests/run_goodix_usb_router_test.sh'
      - 'libfprint-driver/tests/run_goodix_fpimage_device_test.sh'
      - 'libfprint-driver/tests/run_goodix_fpimage_device_test_inner.sh'

permissions:
  contents: read

jobs:
  router:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install host-only build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config libglib2.0-dev libssl-dev libgusb-dev \
            python3 binutils coreutils ripgrep
      - uses: actions/checkout@v4
      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - name: Verify clean checked-in tree
        run: test -z "$(git status --short)"
      - name: Deterministic normal and sanitizer run 1
        run: libfprint-driver/tests/run_goodix_usb_router_test.sh
      - name: Deterministic normal and sanitizer run 2
        run: libfprint-driver/tests/run_goodix_usb_router_test.sh
      - name: FpImageDevice normal and sanitizer regression
        run: libfprint-driver/tests/run_goodix_fpimage_device_test.sh
      - name: Verify no second receive completion API
        run: |
          test "$(rg -n '^goodix_usb_router_receive_complete \(' libfprint-driver/goodix_usb_router.c | wc -l)" -eq 1
          ! rg -n 'GUsbDevice|FpiUsbTransfer|/dev/bus/usb|27c6.*5125' libfprint-driver/goodix_usb_router.[ch]
