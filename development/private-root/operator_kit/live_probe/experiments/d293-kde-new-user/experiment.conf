# SPDX-License-Identifier: GPL-2.0-or-later
EXPERIMENT_ID=d293-kde-new-user
GOAL='Eseguire il protocollo operatore nativo KDE: una enrollment pianificata nel KCM Users del nuovo account, quindi VerifyStart(any) bounded e isolamento dal principal preesistente.'
ACTION=KDE_NEW_USER_ENROLL_MANAGE_VERIFY_ANY
MAX_ACTIONS=5
MAX_CONTACTS=24
MAX_RETRIES=0
TIMEOUT_SECONDS=1800
REQUIRES_ROOT=false
REQUIRES_ACTIVE_USER_SESSION=true
PAYLOAD_REQUIRES_FOREGROUND_TTY=true
LIVE_CAPABLE=true
OFFLINE_TEST_CAPABLE=true
OUTPUT_IS_SANITIZED=false
SANITIZER=sanitize.sh
EXPECTED_TELEMETRY='D293_04_OFFLINE_COMPATIBILITY_PASS KDE_NEW_USER_MATCH'
STOP_CONDITIONS='Stop immediato su duplicato, action GUI extra, errore o stato ambiguo; nessun nuovo enrollment per riprovare. I clic GUI seguono il protocollo operatore, mentre VERIFY resta bounded dallo script.'
CONFIRMATION_TEXT='AVVIA D293 KDE'
PAYLOAD=payload.sh
PRE_AUDIT=audit.sh
POST_AUDIT=audit.sh
CLEANUP=cleanup.sh
CLASSIFIER=classify.sh
PAYLOAD_ACCEPTED_RETURN_CODES=0
COLLECT_JOURNAL=false
COLLECT_JOURNAL_OFFLINE=false
JOURNAL_UNITS=
JOURNAL_GREP_REGEX=
GUI_OPERATION_COUNT_CONTROL=OPERATOR_PROTOCOL
GUI_SESSION_HARD_CAP_REQUIRED=false
PER_ACTION_TECHNICAL_FENCES=UNCHANGED
VERIFY_SERIES_CONTROL=SCRIPT_BOUNDED
RUN_TOTALS_CHECK=OBSERVED_PROTOCOL_BOUNDS
EXTRA_MANUAL_UI_ACTION=PROTOCOL_DEVIATION_STOP
LIVE_CRITICAL_PATHS=(
  production
  libfprint-driver
  Rockytkg
  reference/libfprint-fedora44-1.94.100
  reference/fprintd-fedora44-1.94.5
  operator_kit/d285-01-persistent-sudo
  operator_kit/d286-01-reboot-survival
  'Goodix 27c6 5125 manuale tecnico.md'
)
