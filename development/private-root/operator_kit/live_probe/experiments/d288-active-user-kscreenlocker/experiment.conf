# SPDX-License-Identifier: GPL-2.0-or-later
EXPERIMENT_ID=d288-active-user-kscreenlocker
GOAL='Provare che KScreenLocker --testing, avviato nella sessione grafica attiva, propaga un MATCH dal PAM fingerprint privato fino a Unlocked.'
ACTION=KSCREENLOCKER_ACTIVE_USER_VERIFY
MAX_ACTIONS=3
MAX_CONTACTS=3
MAX_RETRIES=0
TIMEOUT_SECONDS=240
REQUIRES_ROOT=false
REQUIRES_ACTIVE_USER_SESSION=true
LIVE_CAPABLE=true
OFFLINE_TEST_CAPABLE=true
OUTPUT_IS_SANITIZED=false
SANITIZER=sanitize.sh
EXPECTED_TELEMETRY='D288_OFFLINE_COMPATIBILITY_PASS KSCREENLOCKER_MATCH KSCREENLOCKER_NO_MATCH_SERIES'
STOP_CONDITIONS='MATCH arresta subito; solo NO_MATCH offre un nuovo contatto esplicito; PAM, Polkit, host, timeout, signal o safety failure arrestano la serie.'
CONFIRMATION_TEXT='INDICE DESTRO'
PAYLOAD=payload.sh
PRE_AUDIT=audit.sh
POST_AUDIT=audit.sh
CLEANUP=cleanup.sh
CLASSIFIER=classify.sh
PAYLOAD_ACCEPTED_RETURN_CODES=0
COLLECT_JOURNAL=true
COLLECT_JOURNAL_OFFLINE=false
JOURNAL_UNITS=fprintd.service
JOURNAL_GREP_REGEX='GOODIX_|Authorization denied|Verify(Start| result)|prints registered'
LIVE_CRITICAL_PATHS=(
  operator_kit/d286-01-reboot-survival
  operator_kit/d285-01-persistent-sudo
  'Goodix 27c6 5125 manuale tecnico.md'
)
