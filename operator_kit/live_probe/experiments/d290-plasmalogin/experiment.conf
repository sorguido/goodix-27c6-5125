# SPDX-License-Identifier: GPL-2.0-or-later
EXPERIMENT_ID=d290-plasmalogin
GOAL='Provare una singola autenticazione fingerprint del vero Plasma Login Manager fino alla creazione di una nuova sessione.'
ACTION=PLASMALOGIN_ONE_SHOT_VERIFY
MAX_ACTIONS=1
MAX_CONTACTS=1
MAX_RETRIES=0
TIMEOUT_SECONDS=1200
REQUIRES_ROOT=false
REQUIRES_ACTIVE_USER_SESSION=false
LIVE_CAPABLE=true
OFFLINE_TEST_CAPABLE=true
OUTPUT_IS_SANITIZED=false
SANITIZER=sanitize.sh
EXPECTED_TELEMETRY='D290_OFFLINE_COMPATIBILITY_PASS PLASMALOGIN_MATCH_NEW_SESSION PLASMALOGIN_NO_MATCH_PASSWORD_RECOVERY_READY'
STOP_CONDITIONS='Una sola pressione Invio e un solo contatto; MATCH o NO_MATCH arrestano; nessun retry; errore PAM, sessione, greeter, overlay, host, timeout o safety arresta e rilascia overlay.'
CONFIRMATION_TEXT='PREPARA LOGIN D290'
PAYLOAD=payload.sh
PRE_AUDIT=audit.sh
POST_AUDIT=audit.sh
CLEANUP=cleanup.sh
CLASSIFIER=classify.sh
PAYLOAD_ACCEPTED_RETURN_CODES=0
COLLECT_JOURNAL=true
COLLECT_JOURNAL_OFFLINE=false
JOURNAL_UNITS='fprintd.service plasmalogin.service'
JOURNAL_GREP_REGEX='GOODIX_|pam_|Authentication|session opened|Starting Wayland user session'
LIVE_CRITICAL_PATHS=(
  operator_kit/d286-01-reboot-survival
  operator_kit/d285-01-persistent-sudo
  operator_kit/live_probe/experiments/d290-plasmalogin/session-model.sh
  'Goodix 27c6 5125 manuale tecnico.md'
)
