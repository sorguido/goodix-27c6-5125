# SPDX-License-Identifier: GPL-2.0-or-later
name: Bug report
description: Report a problem or unexpected behavior with the Goodix 27c6:5125 driver
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with the Goodix USB `27c6:5125` driver.

        Before filing, check the [supported configuration](https://github.com/sorguido/goodix-27c6-5125#supported-configuration) and [known limitations](https://github.com/sorguido/goodix-27c6-5125/blob/main/docs/VALIDATION.md). Fedora 44 KDE with APP12509 is the qualified target; APP12508 has narrower contributor-reported evidence. Other environments are welcome as reports, but are not automatically supported.

        For fingerprint enrollment, recognition or login problems, please review the practical guidance below. Other issue types can skip steps that do not apply.

  - type: markdown
    attributes:
      value: |
        ### ![Fingerprint](https://raw.githubusercontent.com/sorguido/goodix-27c6-5125/main/.github/ISSUE_TEMPLATE/assets/fingerprint.svg) Before reporting a fingerprint problem

        Many enrollment and recognition problems are related to finger placement, reader condition or timing. **If applicable, try these steps before reporting:**

        1. **Keep your finger and the reader clean and dry.** Place your finger flat and centered, using light, steady pressure. Avoid moving it while recognition is in progress.
        2. **During enrollment, slightly vary the position and angle** between captures, following the on-screen instructions. This helps register different parts of your fingerprint.
        3. **If recognition is unreliable,** try re-enrolling that finger or enrolling another finger as an alternative.
        4. **For fingerprint login after starting or restarting the PC:** press Enter with the password field empty, **wait about 2 seconds**, then place an enrolled finger on the reader. This is practical timing guidance for the Goodix driver, not a guarantee that the sensor is ready after exactly two seconds.
        5. **If the problem remains,** describe exactly when it occurred, how often it happens and what you already tried. Attach only relevant, reviewed and redacted diagnostics when available.

        General fingerprint tips are adapted from [Microsoft's Windows Hello troubleshooting advice](https://support.microsoft.com/en-us/windows/security/windows-hello-common-issues-and-troubleshooting-tips); the two-second wait is specific advice for this Goodix integration.

        ### ![Safety](https://raw.githubusercontent.com/sorguido/goodix-27c6-5125/main/.github/ISSUE_TEMPLATE/assets/shield-alert.svg) Safety and privacy

        Keep password login available. Share only relevant, redacted logs. **Never upload** pairing keys or state directories, fingerprint templates/images, passwords, firmware dumps, raw USB captures or other secrets. Do not flash or reset the reader to reproduce a bug.

  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting guidance
      description: Confirm you have read the tips above. Enrollment and login tips may not apply to unrelated issues such as installation failures.
      options:
        - label: I have read the troubleshooting guidance and tried the applicable steps, or they do not apply to my issue.
          required: true

  - type: input
    id: version
    attributes:
      label: Driver version
      description: Release tag or commit hash used to build/install the driver
      placeholder: "e.g. v2.2.1 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: firmware
    attributes:
      label: Reader firmware application
      description: Select the exact application identity if known
      options:
        - GF_ST411SEC_APP_12509
        - GF_ST411SEC_APP_12508
        - Other / unknown
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Linux distribution and version
      placeholder: "e.g. Fedora 44"
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      placeholder: "e.g. KDE Plasma 6, GNOME, or headless"

  - type: input
    id: hardware
    attributes:
      label: Laptop / host model
      placeholder: "e.g. Huawei MateBook D 15"

  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Installation / update
        - Fingerprint enrollment
        - Fingerprint verification / identification
        - Desktop login / PAM
        - Screen unlock
        - sudo / PolicyKit authentication
        - fprintd / device detection
        - Windows coexistence
        - Uninstall / recovery
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Rarely
        - Happened once
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (minor issue)
        - Medium (annoying but usable)
        - High (blocks fingerprint workflow)
        - Critical (login or recovery blocked)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior, including any visible error
      placeholder: "Describe the problem..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What did you expect to happen?"

  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: "If available, share a short relevant excerpt from fprintd/journalctl. Redact personal and biometric-derived information; never attach pairing state or raw captures."
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: "Relevant installation details, safe screenshots, or links to related issues"
