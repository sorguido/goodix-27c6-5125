name: D276 FpImageDevice host-only validation

on:
  workflow_dispatch:
  push:
    branches:
      - d276-02-github-actions-validation
    paths:
      - .github/workflows/d276-fpimage-device-host-only.yml
      - libfprint-driver/**
      - Rockytkg/libfprint/**

permissions:
  contents: read

jobs:
  host-only-validation:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 20

    steps:
      - name: Install host-only build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config libglib2.0-dev \
            python3 binutils coreutils

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Git safe directory for container mount
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Inventory execution environment
        run: |
          set -eu
          gcc --version | head -n 1
          pkg-config --version
          pkg-config --modversion glib-2.0 gio-2.0 gobject-2.0
          python3 --version
          timeout --version | head -n 1
          nm --version | head -n 1
          if command -v flatpak >/dev/null 2>&1; then
            echo "FLATPAK_AVAILABLE=true"
          else
            echo "FLATPAK_AVAILABLE=false"
          fi
          echo "REAL_USB_ACCESS=false"
          echo "LIVE_AUTHORIZED=false"

      - name: Diagnostic - apply bounded ownership and cancellation fixes in worktree only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('libfprint-driver/goodix_fpimage_device.c')
          s = p.read_text()
          old_cancel = '''  ctx->terminal_fence = TRUE;
            if (ctx->activation_cancellable != NULL)
              g_cancellable_cancel (ctx->activation_cancellable);
          '''
          new_cancel = '''  ctx->terminal_fence = TRUE;
          '''
          if s.count(old_cancel) != 1:
              raise SystemExit('FAIL_CLOSED: terminal-fence cancellable block count mismatch')
          s = s.replace(old_cancel, new_cancel, 1)

          old_image = '''  /* fpi_image_device_image_captured() takes its own reference as needed. */
            fpi_image_device_image_captured (FP_IMAGE_DEVICE (ctx->device), image);
          '''
          new_image = '''  /* Transfer an independent reference to FpImageDevice; the pipeline keeps its own. */
            fpi_image_device_image_captured (FP_IMAGE_DEVICE (ctx->device),
                                             g_object_ref (image));
          '''
          if s.count(old_image) != 1:
              raise SystemExit('FAIL_CLOSED: image handoff block count mismatch')
          p.write_text(s.replace(old_image, new_image, 1))

          t = Path('libfprint-driver/tests/test_goodix_fpimage_device.c')
          s = t.read_text()
          old_enroll = 'fp_device_enroll (FP_DEVICE (f->device), template, cancellable,'
          new_enroll = 'fp_device_enroll (FP_DEVICE (f->device), g_steal_pointer (&template), cancellable,'
          if s.count(old_enroll) != 2:
              raise SystemExit(f'FAIL_CLOSED: expected 2 floating-template handoffs, found {s.count(old_enroll)}')
          t.write_text(s.replace(old_enroll, new_enroll))
          PY
          git diff --check
          git diff -- libfprint-driver/goodix_fpimage_device.c libfprint-driver/tests/test_goodix_fpimage_device.c
          echo "CI_DIAGNOSTIC_PATCH=NO_SELF_CANCEL_PLUS_FPIMAGE_REF_PLUS_FLOATING_FPPRINT_TRANSFER"

      - name: Run D276/02 launcher twice
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          for run in 1 2; do
            echo "=== D276/02 deterministic run ${run}/2 ==="
            timeout --signal=TERM 180 sh libfprint-driver/tests/run_goodix_fpimage_device_test.sh
          done
          echo "DETERMINISM_RUNS=2"
          echo "D276_02_HOST_ONLY_EXECUTABLE_VALIDATION=PASS_DIAGNOSTIC_PATCHES"
