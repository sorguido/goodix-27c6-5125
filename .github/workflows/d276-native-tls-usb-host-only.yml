# SPDX-License-Identifier: LGPL-2.1-or-later
name: D276 native TLS and async USB host-only
on:
  workflow_dispatch:
  pull_request:
  push:
permissions: { contents: read }
jobs:
  host-only:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git build-essential pkg-config libglib2.0-dev libssl-dev python3 binutils coreutils ripgrep
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && test -z "$(git status --short)"
      - name: D276/04 deterministic normal and sanitizer runs
        run: |
          libfprint-driver/tests/run_goodix_d276_04_test.sh
          libfprint-driver/tests/run_goodix_d276_04_test.sh
      - name: D276/02 and D276/03 regressions
        run: |
          libfprint-driver/tests/run_goodix_fpimage_device_test.sh
          libfprint-driver/tests/run_goodix_usb_router_test.sh
      - name: Static safety audit
        run: |
          ! rg -n 'socket\s*\(|connect\s*\(|/dev/bus/usb|27c6.*5125' libfprint-driver/goodix_tls_server.[ch] libfprint-driver/goodix_fpi_usb_backend.[ch]
          test "$(rg -n 'goodix_usb_router_receive_complete \(' libfprint-driver/goodix_fpi_usb_backend.c | wc -l)" -eq 1
          git diff --check HEAD^
