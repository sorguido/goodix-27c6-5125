name: D276 promote causally validated host-only fixes

on:
  push:
    branches:
      - d276-02-github-actions-validation
    paths:
      - .github/workflows/d276-promote-validated-fixes.yml

permissions:
  contents: write

jobs:
  promote-validated-fixes:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 20

    steps:
      - name: Install host-only build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config libglib2.0-dev \
            python3 binutils coreutils

      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: d276-02-github-actions-validation
          fetch-depth: 0

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          git status --short --branch

      - name: Apply validated patch and re-run executable gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/d276_fpimage_device_diagnostic_patch.py
          git diff --check
          ulimit -c 0
          for run in 1 2; do
            echo "=== PROMOTION GATE ${run}/2 ==="
            timeout --signal=TERM 180 sh libfprint-driver/tests/run_goodix_fpimage_device_test.sh
          done
          echo "PROMOTION_GATE=PASS"

      - name: Convert branch to clean checked-in implementation
        shell: bash
        run: |
          set -euo pipefail

          git rm -f .github/d276_fpimage_device_diagnostic_patch.py
          git rm -f .github/workflows/d276-promote-validated-fixes.yml

          cat > .github/workflows/d276-fpimage-device-host-only.yml <<'YAML'
          name: D276 FpImageDevice host-only validation

          on:
            workflow_dispatch:
            push:
              branches:
                - d276-02-github-actions-validation
              paths:
                - .github/workflows/d276-fpimage-device-host-only.yml
                - libfprint-driver/**
                - Rockytkg/libfprint/**

          permissions:
            contents: read

          jobs:
            host-only-validation:
              runs-on: ubuntu-24.04
              container:
                image: ubuntu:24.04
              timeout-minutes: 20

              steps:
                - name: Install host-only build prerequisites
                  run: |
                    apt-get update
                    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                      ca-certificates git build-essential pkg-config libglib2.0-dev \
                      python3 binutils coreutils

                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Configure Git safe directory for container mount
                  run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

                - name: Inventory execution environment
                  run: |
                    set -eu
                    gcc --version | head -n 1
                    pkg-config --version
                    pkg-config --modversion glib-2.0 gio-2.0 gobject-2.0
                    python3 --version
                    timeout --version | head -n 1
                    nm --version | head -n 1
                    if command -v flatpak >/dev/null 2>&1; then
                      echo "FLATPAK_AVAILABLE=true"
                    else
                      echo "FLATPAK_AVAILABLE=false"
                    fi
                    echo "REAL_USB_ACCESS=false"
                    echo "LIVE_AUTHORIZED=false"

                - name: Verify clean checked-in tree
                  run: |
                    git diff --exit-code
                    git status --short
                    echo "CI_DIAGNOSTIC_PATCH=NONE"

                - name: Run D276/02 launcher twice
                  shell: bash
                  run: |
                    set -euo pipefail
                    ulimit -c 0
                    for run in 1 2; do
                      echo "=== D276/02 deterministic run ${run}/2 ==="
                      timeout --signal=TERM 180 sh libfprint-driver/tests/run_goodix_fpimage_device_test.sh
                    done
                    echo "DETERMINISM_RUNS=2"
                    echo "D276_02_HOST_ONLY_EXECUTABLE_VALIDATION=PASS_CLEAN_TREE"
          YAML

          git diff --check

          ACTUAL="$(git diff HEAD --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/d276_fpimage_device_diagnostic_patch.py' \
            '.github/workflows/d276-fpimage-device-host-only.yml' \
            '.github/workflows/d276-promote-validated-fixes.yml' \
            'libfprint-driver/goodix_fpimage_device.c' \
            'libfprint-driver/tests/test_goodix_fpimage_device.c' | sort)"
          printf '%s\n' '=== promotion changed files ===' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo 'FAIL_CLOSED: unexpected promotion file set' >&2
            exit 41
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          STAGED="$(git diff --cached --name-only | sort)"
          printf '%s\n' '=== promotion staged files ===' "$STAGED"
          test "$STAGED" = "$EXPECTED" || {
            echo 'FAIL_CLOSED: unexpected staged promotion file set' >&2
            exit 42
          }
          git commit -m 'fix(d276): promote validated FpImageDevice lifecycle corrections'
          git push origin HEAD:d276-02-github-actions-validation
          echo "PROMOTION_PUSHED_HEAD=$(git rev-parse HEAD)"
