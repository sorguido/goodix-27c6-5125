name: D264-03 verify and materialize

on:
  push:
    branches:
      - codex/chiudere-wiring-pre-live-offline

permissions:
  contents: write

jobs:
  verify-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/chiudere-wiring-pre-live-offline
          fetch-depth: 0

      - name: Verify byte closure and reconstruct canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile

          root = Path('.')
          manifest_path = root / 'analysis/D264/D264_03_live_critical_manifest.json'
          bundle_manifest_path = root / 'analysis/D264/D264_03_bundle_manifest.json'
          b64_path = root / 'analysis/D264/D264_03_first_image_prelive_wiring_bundle.zip.b64'
          zip_path = root / 'analysis/D264/D264_03_first_image_prelive_wiring_bundle.zip'
          sidecar_path = root / 'analysis/D264/D264_03_first_image_prelive_wiring_bundle.zip.sha256'

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha256_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          future_rows = manifest['future_live_critical_files']
          offline_rows = manifest['d264_03_offline_gate_files']
          assert len(future_rows) == manifest['future_live_critical_file_count'] == 18
          assert len(offline_rows) == manifest['d264_03_offline_gate_file_count'] == 2
          future_paths = [row['path'] for row in future_rows]
          offline_paths = [row['path'] for row in offline_rows]
          assert len(future_paths) == len(set(future_paths))
          assert len(offline_paths) == len(set(offline_paths))
          assert not set(future_paths) & set(offline_paths)
          assert 'tools/d261_live_fdt_arm_once.py' in future_paths
          assert 'core/live_capability.py' in future_paths
          for row in future_rows + offline_rows:
              path = root / row['path']
              assert path.is_file(), f'missing reviewed file: {row["path"]}'
              actual = sha256_file(path)
              assert actual == row['sha256'], f'hash mismatch {row["path"]}: {actual} != {row["sha256"]}'

          bundle_manifest = json.loads(bundle_manifest_path.read_text(encoding='utf-8'))
          payload_rows = bundle_manifest['payload_paths']
          payload_paths = [row['path'] for row in payload_rows]
          assert len(payload_paths) == len(set(payload_paths))
          for row in payload_rows:
              path = root / row['path']
              assert path.is_file(), f'missing bundle payload: {row["path"]}'
              actual = sha256_file(path)
              assert actual == row['sha256'], f'payload hash mismatch {row["path"]}'

          encoded = ''.join(b64_path.read_text(encoding='ascii').split())
          decoded = base64.b64decode(encoded, validate=True)
          zip_path.write_bytes(decoded)
          actual_zip_sha = sha256_bytes(decoded)
          expected_zip_sha = bundle_manifest['canonical_zip_sha256']
          sidecar_sha = sidecar_path.read_text(encoding='utf-8').split()[0]
          assert actual_zip_sha == expected_zip_sha == sidecar_sha, (
              actual_zip_sha, expected_zip_sha, sidecar_sha
          )

          with zipfile.ZipFile(zip_path, 'r') as zf:
              assert zf.testzip() is None
              file_names = [name for name in zf.namelist() if not name.endswith('/')]
              assert set(file_names) == set(payload_paths), (
                  'ZIP payload set mismatch', sorted(file_names), sorted(payload_paths)
              )
              for row in payload_rows:
                  data = zf.read(row['path'])
                  assert sha256_bytes(data) == row['sha256'], f'ZIP member hash mismatch {row["path"]}'

          print('D264_03_REMOTE_BYTE_CLOSURE=PASS')
          print(f'D264_03_CANONICAL_ZIP_SHA256={actual_zip_sha}')
          PY
          unzip -t analysis/D264/D264_03_first_image_prelive_wiring_bundle.zip

      - name: Replace transport with canonical ZIP and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f analysis/D264/D264_03_first_image_prelive_wiring_bundle.zip.b64
          rm -f .github/workflows/d264-03-materialize.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(D264): materialize canonical D264/03 bundle"
          git push origin HEAD:codex/chiudere-wiring-pre-live-offline
